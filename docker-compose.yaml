services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: rates
      POSTGRES_PASSWORD: rates
      POSTGRES_DB: rates
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rates -d rates"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - data:/var/lib/postgresql
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
      - "4317:4317"
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      DATABASE_DSN: postgres://rates:rates@postgres:5432/rates?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRINEX_USE_STUB: "true"
    ports:
      - "50051:50051"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  data: