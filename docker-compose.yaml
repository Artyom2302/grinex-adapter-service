services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: rates
      POSTGRES_PASSWORD: rates
      POSTGRES_DB: rates
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rates -d rates"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - data:/var/lib/postgresql

volumes:
  data: